<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Altimit OS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===================== DESKTOP ===================== -->
  <div id="desktop">
    <!-- light band + glass shards + hex grid live in ::before/layers -->
    <div class="shards" id="shards">
      <i style="left:-6%; top:52%; width:52%; height:150px; transform:rotate(-34deg); opacity:.42"></i>
      <i style="left:2%;  top:28%; width:34%; height:120px; transform:rotate(-60deg); opacity:.30"></i>
      <i style="left:-4%; top:70%; width:66%; height:78px;  transform:rotate(-22deg); opacity:.5"></i>
      <i style="left:6%;  top:20%; width:26%; height:170px; transform:rotate(-72deg); opacity:.24"></i>
      <i style="left:4%;  top:62%; width:58%; height:54px;  transform:rotate(-27deg); opacity:.4"></i>
      <i style="left:12%; top:46%; width:46%; height:66px;  transform:rotate(-38deg); opacity:.34"></i>
      <i style="left:0%;  top:82%; width:50%; height:40px;  transform:rotate(-15deg); opacity:.48"></i>
      <i style="left:16%; top:38%; width:40%; height:44px;  transform:rotate(-31deg); opacity:.42"></i>
      <i style="left:9%;  top:58%; width:78%; height:28px;  transform:rotate(-24deg); opacity:.28"></i>
    </div>

    <!-- ambient transparent data panes (HUD) -->
    <div class="hud hud-sys" id="hud-sys">
      <div class="hud-title">SYSTEM</div>
      <div class="hud-row"><span>HOST</span><b id="hud-host">—</b></div>
      <div class="hud-row"><span>ADDR</span><b id="hud-ip">—</b></div>
      <div class="hud-row"><span>KERNEL</span><b id="hud-kernel">—</b></div>
      <div class="hud-row"><span>UPTIME</span><b id="hud-up">—</b></div>
      <div class="hud-row"><span>LINK</span><b id="hud-link" class="ok">—</b></div>
    </div>

    <div class="hud hud-net" id="hud-net">
      <canvas class="hud-spark" id="hud-spark" width="150" height="34"></canvas>
      <div class="hud-rates">
        <span class="dn"><i>▼</i><b id="hud-dn">0.0</b></span>
        <span class="up"><i>▲</i><b id="hud-up-rate">0.0</b></span>
        <small id="hud-unit">Kbps</small>
      </div>
    </div>

    <div class="desk-watermark">
      <div class="wm-lock">
        <span class="brand"><b>[</b> ALTIMIT <b>]</b></span>
        <span class="brand-sub">OPERATING SYSTEMS</span>
      </div>
      <span class="spiral spiral-sm" id="wm-spiral"></span>
    </div>

    <div class="desk-icons" id="desk-icons"></div>
    <div id="windows"></div>
  </div>

  <!-- ===================== TASKBAR ===================== -->
  <div id="taskbar">
    <div class="tb-start" id="tb-start"><b>[</b>&nbsp;ALTIMIT&nbsp;<b>]</b></div>
    <div class="tb-tasks" id="tb-tasks"></div>
    <div class="tb-tray">
      <div class="tb-net">CC-NET&nbsp;●</div>
      <div class="tb-userbox"><span id="tb-user"></span></div>
      <div class="tb-clock"><div class="t" id="clk-t">00:00:00</div><div class="d" id="clk-d">----.--.--</div></div>
    </div>
  </div>

  <!-- ===================== START MENU ===================== -->
  <div id="startmenu"></div>

  <!-- ===================== DESKTOP CONTEXT MENU ===================== -->
  <div id="ctxmenu"></div>

  <!-- ===================== CALENDAR POPUP ===================== -->
  <div id="calpop"></div>

  <!-- ===================== SNAP HINT ===================== -->
  <div id="snaphint"></div>

  <!-- ===================== TOASTS ===================== -->
  <div id="toast"></div>

  <!-- ===================== LOGIN (first access) ===================== -->
  <div id="login">
    <div class="login-card">
      <span class="spiral spiral-lg" id="login-spiral"></span>
      <div class="login-brand"><b>[</b> ALTIMIT <b>]</b></div>
      <div class="login-sub">CREATE ACCOUNT</div>
      <div class="login-msg">Register a username to connect to The World.</div>
      <input id="login-input" maxlength="16" placeholder="USERNAME" autocomplete="off" spellcheck="false">
      <button class="btn" id="login-go">REGISTER</button>
      <div class="login-err" id="login-err"></div>
    </div>
  </div>

  <!-- ===================== SKIP HINT ===================== -->
  <div id="skip-hint">press any key to skip ▸</div>

  <!-- ===================== POST / BIOS (pre-boot) ===================== -->
  <div id="post"><div class="post-log" id="post-log"></div><span class="post-cursor">_</span></div>

  <!-- ===================== BOOT ===================== -->
  <div id="boot">
    <div class="boot-hex"></div>
    <div class="boot-center">
      <span class="spiral spiral-lg" id="boot-spiral"></span>
      <div class="boot-lock">
        <div class="boot-brand"><b>[</b> ALTIMIT <b>]</b></div>
        <div class="boot-brand-sub">OPERATING SYSTEMS</div>
        <div class="boot-strip" id="boot-strip"></div>
      </div>
    </div>
    <div class="boot-ring"></div>
    <div class="boot-log" id="boot-log"></div>
    <div class="boot-bar"><i id="boot-bar"></i></div>
    <div class="boot-copy" id="boot-copy"></div>
  </div>

  <script src="sysinfo.js"></script>
  <script src="bridge.js"></script>
  <script src="data.js"></script>
  <script src="os.js"></script>
</body>
</html>

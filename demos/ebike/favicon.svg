    <polygon points="100,5 190,95 100,185 10,95" />

    <!-- Sun rays -->
    <!-- Right side -->
    <line x1="135" y1="95" x2="175" y2="80" />
    <line x1="125" y1="75" x2="155" y2="45" />
    <line x1="115" y1="58" x2="130" y2="25" />
    <!-- Left side -->
